[package]
name = "beebotos-foreign-rt"
version = "1.0.0"
edition = "2021"
authors = ["BeeBotOS Team"]
description = "BeeBotOS Foreign Runtime - Python & Node.js execution support"
license = "MIT"
repository = "https://github.com/linc77/beebotos"

[dependencies]
beebotos-core = { path = "../core" }
beebotos-kernel = { path = "../kernel", features = ["wasm"] }

# Async runtime
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging/tracing
tracing = "0.1"

# Metrics
metrics = "0.24"

# Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
which = "6.0"
libc = "0.2"

# WASM runtime (for WASM path)
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }

# Process sandboxing (Linux-only)
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["process", "sched", "mount", "fs"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"
mockall = "0.12"
